name: Validate Global Trust Network
on:
  push:
    branches:
      - rebuild/global-trust-network
  pull_request:
    branches:
      - rebuild/global-trust-network
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production app
        run: npm run build
