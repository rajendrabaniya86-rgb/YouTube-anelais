name: Global Trust Network RLS Security Test
on:
  push:
    branches:
      - rebuild/global-trust-network
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rls-security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rebuild/global-trust-network
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test offline ledger service
        run: npm run test:offline-ledger-service
      - name: Run isolated synthetic-account RLS tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EXPECTED_SUPABASE_PROJECT_REF: wlohqkgegsknygdxufie
          TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/test-rls-isolation.mjs
