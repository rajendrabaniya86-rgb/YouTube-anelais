name: Daily upload

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-lohit-deva
      - run: pip install -r requirements.txt
      - run: python scripts/run_daily.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CHANNEL_TOPIC: ${{ vars.CHANNEL_TOPIC }}
          CHANNEL_LANGUAGE: ${{ vars.CHANNEL_LANGUAGE }}
          DAILY_SHORTS: ${{ vars.DAILY_SHORTS }}
          DAILY_LONGS: ${{ vars.DAILY_LONGS }}
          ENABLE_SCHEDULER: "false"
