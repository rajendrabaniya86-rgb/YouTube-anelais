name: Global Trust Network Android APK
# Re-run the APK pipeline against the latest feature-branch source.

on:
  push:
    branches:
      - rebuild/global-trust-network
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/configure-android-deeplink.mjs'
      - 'supabase/functions/ensure-google-account/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtn-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/global-trust-network

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify required public build configuration
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_URL"
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run security and UI tests
        run: |
          npm run test:offline-ledger-service
          npm run test:ledger-math
          npm run test:session-guards
          npm run test:universal-ledger-migration
          npm run test:ui-isolation

      - name: Build production web app
        run: npm run build

      - name: Generate Android project and sync fresh web build
        run: |
          npx cap add android
          node scripts/configure-android-deeplink.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: global-trust-network-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
