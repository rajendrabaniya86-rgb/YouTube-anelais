<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101c2c" />
    <meta name="description" content="Global Trust Network - सरल, पारदर्शी और भरोसेमंद उधार खाता।" />
    <title>Global Trust Network</title>
    <style>
      #gtn-startup-diagnostic{display:none;position:fixed;inset:0;z-index:2147483647;overflow:auto;background:#f3f6fa;color:#172437;padding:28px 18px;font:14px/1.6 Arial,sans-serif}
      #gtn-startup-diagnostic .panel{max-width:560px;margin:6vh auto;padding:22px;background:#fff;border:1px solid #e1e7ef;border-radius:16px;box-shadow:0 8px 32px #17243712}
      #gtn-startup-diagnostic h2{margin:0 0 10px;font-size:21px}
      #gtn-startup-diagnostic .cause{padding:12px;background:#fff3e8;border:1px solid #f1d4bd;border-radius:9px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:12px}
      #gtn-startup-diagnostic button{margin-top:14px;padding:12px 18px;border:0;border-radius:9px;background:#192b40;color:white;font-weight:700}
      #gtn-startup-diagnostic small{display:block;color:#64748b;margin-top:12px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <section id="gtn-startup-diagnostic" role="alert">
      <div class="panel">
        <h2>Global Trust Network शुरू नहीं हो पाया</h2>
        <p>ऐप की शुरुआती जाँच में समस्या मिली। नीचे दिया संदेश समस्या पहचानने में मदद करेगा।</p>
        <div class="cause" id="gtn-startup-cause">ऐप की JavaScript शुरू नहीं हुई या स्क्रीन तैयार नहीं कर पाई।</div>
        <button onclick="window.location.reload()">ऐप दोबारा खोलें</button>
        <small>इस स्क्रीन का पूरा स्क्रीनशॉट सहायता के लिए भेजें।</small>
      </div>
    </section>
    <script>
      (function () {
        var panel = document.getElementById('gtn-startup-diagnostic');
        var cause = document.getElementById('gtn-startup-cause');
        var shown = false;
        function show(reason) {
          if (shown) return;
          shown = true;
          cause.textContent = String(reason || 'अज्ञात शुरुआती त्रुटि');
          panel.style.display = 'block';
        }
        window.addEventListener('error', function (event) {
          var message = event && (event.message || (event.target && (event.target.src || event.target.href)));
          if (message) show('JavaScript / फ़ाइल लोड त्रुटि: ' + message);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          show('ऐप की Promise त्रुटि: ' + (reason && (reason.stack || reason.message) || reason || 'अज्ञात कारण'));
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          var visibleText = root && (root.innerText || root.textContent || '').trim();
          if (!visibleText) show('10 सेकंड बाद भी ऐप ने कोई स्क्रीन नहीं दिखाई। संभावित कारण: JavaScript bundle लोड नहीं हुआ, Android WebView समस्या, या शुरुआती render रुक गया।');
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
